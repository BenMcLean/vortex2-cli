[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vortex-cli"
version = "0.1.0"
description = "Command-line tool for Alesis Vortex Wireless 2 presets: .vw2 files, SysEx files, human-editable JSON, and direct USB-MIDI transfer."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
midi = ["mido>=1.3", "python-rtmidi>=1.5"]
dev = ["pytest>=8", "jsonschema>=4", "ruff>=0.6"]

[project.scripts]
vortex = "vortex_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vortexlib", "src/vortex_cli"]

[tool.ruff]
indent-width = 4
extend-exclude = [".venv", ".pytest_cache"]

[tool.ruff.format]
indent-style = "tab"

[tool.pytest.ini_options]
testpaths = ["tests"]
